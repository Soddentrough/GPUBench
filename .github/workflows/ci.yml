name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        run: |
          VERSION=$(curl -sL https://vulkan.lunarg.com/sdk/latest/linux.txt)
          echo "Downloading latest Vulkan SDK version $VERSION..."
          curl -sL "https://sdk.lunarg.com/sdk/download/$VERSION/linux/vulkansdk-linux-x86_64-$VERSION.tar.xz" -o /tmp/vulkansdk.tar.xz
          mkdir -p "$HOME/VulkanSDK"
          tar -xf /tmp/vulkansdk.tar.xz -C "$HOME/VulkanSDK"
          VULKAN_ROOT="$HOME/VulkanSDK/$VERSION/x86_64"
          echo "VULKAN_SDK=$VULKAN_ROOT" >> $GITHUB_ENV
          echo "$VULKAN_ROOT/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$VULKAN_ROOT/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libvulkan1 \
            ocl-icd-opencl-dev \
            opencl-headers \
            cmake \
            build-essential \
            rpm \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxss-dev \
            libxtst-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGPUBENCH_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Automated Headless Unit Tests (CTest)
        run: ctest --test-dir build --output-on-failure

      - name: Package RPM & Run Dry-Run Verification
        run: |
          cmake --build build --target package_rpm
          python3 scripts/verify_rpm.py --skip-install-test

      - name: Smoke test (list commands)
        run: |
          echo "Smoke test only: GPU-less CI runners may fail the list commands; build failures above are NOT masked."
          ./build/gpubench --list-benchmarks || true
          ./build/gpubench --list-backends || true

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile VulkanSDK.exe
          Start-Process -FilePath .\VulkanSDK.exe -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install" -NoNewWindow -Wait
          echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run Automated Headless Unit Tests (CTest)
        run: ctest --test-dir build --output-on-failure -C Release
