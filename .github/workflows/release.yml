name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile VulkanSDK.exe
          Start-Process -FilePath .\VulkanSDK.exe -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install" -NoNewWindow -Wait
          echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@v2

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="GPUBench"

      - name: Build C++ Target
        run: |
          cd build
          cmake --build . --config Release

      - name: Package with CPack
        run: |
          cd build
          cpack -G ZIP -C Release
          cpack -G NSIS -C Release

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/GPUBench-*-win64.zip
            build/GPUBench-*-win64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Vulkan SDK
        run: |
          VERSION=$(curl -sL https://vulkan.lunarg.com/sdk/latest/mac.txt)
          echo "Downloading Vulkan SDK version $VERSION"
          curl -L -o vulkan_sdk.zip "https://sdk.lunarg.com/sdk/download/$VERSION/mac/vulkan_sdk.zip?Human=true"
          unzip -q vulkan_sdk.zip
          ./vulkansdk-macOS-*/Contents/MacOS/vulkansdk-macOS-* \
            --root "$GITHUB_WORKSPACE/VulkanSDK" \
            --accept-licenses \
            --default-answer \
            --confirm-command install
          echo "VULKAN_SDK=$GITHUB_WORKSPACE/VulkanSDK/macOS" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/VulkanSDK/macOS/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@v2

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="GPUBench"

      - name: Build C++ Target
        run: |
          cd build
          cmake --build . --config Release

      - name: Package with CPack
        run: |
          cd build
          cpack -G DragNDrop -C Release
          cpack -G TGZ -C Release

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/GPUBench-*-Darwin.dmg
            build/GPUBench-*-Darwin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Vulkan SDK (LunarG apt repo)
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ocl-icd-opencl-dev \
            opencl-headers \
            cmake \
            build-essential \
            rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@v2

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="GPUBench"

      - name: Build C++ Target
        run: |
          cd build
          cmake --build . --config Release --parallel

      - name: Package with CPack
        run: |
          cd build
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/GPUBench-*-Linux.deb
            build/GPUBench-*-Linux.rpm
            build/GPUBench-*-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
