app-id: io.github.soddentrough.gpubench
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: gpubench-gui

finish-args:
  # Wayland and X11 display access
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Full GPU compute device access (/dev/dri, /dev/kfd)
  - --device=all
  # Filesystem permissions for saving test results and exported renders
  - --filesystem=xdg-documents:create
  - --filesystem=xdg-download:create
  # Host read access for AMD ROCm runtime libraries if installed on host
  - --filesystem=/opt/rocm:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/gpubench/cargo

modules:
  - name: gpubench
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_VULKAN=ON
      - -DENABLE_OPENCL=ON
      - -DENABLE_ROCM=ON
    sources:
      - type: dir
        path: ../../..
    post-install:
      # Install desktop entry and AppStream metadata
      - install -Dm644 packaging/linux/io.github.soddentrough.gpubench.desktop /app/share/applications/io.github.soddentrough.gpubench.desktop
      - install -Dm644 packaging/linux/io.github.soddentrough.gpubench.metainfo.xml /app/share/metainfo/io.github.soddentrough.gpubench.metainfo.xml
      # Install hicolor icons
      - install -Dm644 packaging/linux/icons/hicolor/16x16/apps/io.github.soddentrough.gpubench.png /app/share/icons/hicolor/16x16/apps/io.github.soddentrough.gpubench.png
      - install -Dm644 packaging/linux/icons/hicolor/32x32/apps/io.github.soddentrough.gpubench.png /app/share/icons/hicolor/32x32/apps/io.github.soddentrough.gpubench.png
      - install -Dm644 packaging/linux/icons/hicolor/48x48/apps/io.github.soddentrough.gpubench.png /app/share/icons/hicolor/48x48/apps/io.github.soddentrough.gpubench.png
      - install -Dm644 packaging/linux/icons/hicolor/64x64/apps/io.github.soddentrough.gpubench.png /app/share/icons/hicolor/64x64/apps/io.github.soddentrough.gpubench.png
      - install -Dm644 packaging/linux/icons/hicolor/128x128/apps/io.github.soddentrough.gpubench.png /app/share/icons/hicolor/128x128/apps/io.github.soddentrough.gpubench.png
      - install -Dm644 packaging/linux/icons/hicolor/256x256/apps/io.github.soddentrough.gpubench.png /app/share/icons/hicolor/256x256/apps/io.github.soddentrough.gpubench.png
      # Install shell completions
      - install -Dm644 packaging/linux/completions/gpubench /app/share/bash-completion/completions/gpubench
      - install -Dm644 packaging/linux/completions/_gpubench /app/share/zsh/site-functions/_gpubench
      - install -Dm644 packaging/linux/completions/gpubench.fish /app/share/fish/vendor_completions.d/gpubench.fish
      # Install man page
      - install -Dm644 packaging/linux/man/gpubench.1 /app/share/man/man1/gpubench.1
