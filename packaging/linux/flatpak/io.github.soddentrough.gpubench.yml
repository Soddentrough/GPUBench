app-id: io.github.soddentrough.gpubench
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: gpubench-gui

finish-args:
  # Wayland and X11 display access
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Full GPU compute device access (/dev/dri, /dev/kfd)
  - --device=all
  # Filesystem permissions for saving test results and exported renders
  - --filesystem=xdg-documents:create
  - --filesystem=xdg-download:create
  # Host read access for AMD ROCm runtime libraries if installed on host
  - --filesystem=/opt/rocm:ro

modules:
  - name: gpubench
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: dir
        path: ../../..
